<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Install X Unfollow Helper</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0f12;color:#e8eaed;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
       background-image:radial-gradient(60% 40% at 50% 0%,rgba(245,185,66,.16),transparent 70%)}
  .card{width:100%;max-width:440px;background:#1b1e22;border:1px solid #2c3036;border-radius:26px;padding:28px 22px;text-align:center}
  .b{font-size:54px;display:inline-block;animation:rock 1.2s ease-in-out infinite alternate;transform-origin:50% 85%}
  @keyframes rock{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  h1{font:800 26px/1.15 Poppins,system-ui,sans-serif;margin:10px 0 6px}
  .dim{color:#9aa4ad;margin:0 0 20px}
  ol{text-align:left;margin:0 0 22px;padding:0;list-style:none;counter-reset:k}
  li{counter-increment:k;position:relative;padding:4px 0 14px 44px;color:#c8ced4}
  li:before{content:counter(k);position:absolute;left:0;top:2px;width:30px;height:30px;border-radius:50%;border:1.5px solid #f5b942;color:#f5b942;display:grid;place-items:center;font:800 14px Poppins,sans-serif}
  li b{color:#fff}
  .btn{display:block;background:#f5b942;color:#1a1400;text-decoration:none;font-weight:800;border-radius:999px;padding:16px;font-size:17px;box-shadow:0 10px 30px -10px rgba(245,185,66,.7)}
  .back{display:inline-block;margin-top:16px;color:#9aa4ad;text-decoration:none;font-size:14px}
  @media (prefers-reduced-motion:reduce){.b{animation:none}}
</style>
</head>
<body>
<div class="card">
  <div class="b" aria-hidden="true">🧹</div>
  <h1>One tap to install</h1>
  <p class="dim" id="lead">Here's what happens next.</p>
  <ol id="steps"></ol>
  <a class="btn" href="/x-unfollow-helper.user.js">Open the script</a>
  <a class="back" href="/#install">← Back to setup steps</a>
</div>
<script>
  const q = new URLSearchParams(location.search).get('d');
  const ua = navigator.userAgent;
  const d = q || (/iPhone|iPad|iPod/.test(ua) ? 'ios' : /Android/.test(ua) ? 'android' : 'pc');
  const S = {
    ios: ['Tap <b>Open the script</b>. A page full of code opens, that\'s normal.',
          'Tap the <b>page menu</b> on the left of the address bar, then <b>Userscripts</b>.',
          'Tap the yellow <b>Tap to install</b> bar and confirm.',
          'Open <b>x.com</b> in Safari, go to your Following page and tap <b>🧹</b>.'],
    android: ['Tap <b>Open the script</b> in Firefox.',
              'Tampermonkey opens an install page. Tap <b>Install</b>.',
              'Open <b>x.com</b>, go to your Following page and tap <b>🧹</b>.'],
    pc: ['Click <b>Open the script</b>.',
         'Tampermonkey opens an install page. Click <b>Install</b>.',
         'Open <b>x.com</b>, go to your Following page and click <b>🧹</b>.'],
  };
  document.getElementById('steps').innerHTML = (S[d] || S.pc).map(s => '<li>' + s + '</li>').join('');
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
